name: Validate UI Library

on:
  pull_request:
    branches:
      - dev
    paths:
      - "apps/storybook/**"
      - "apps/registry/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate UI Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check UI Barrels
        run: pnpm --filter @repo/ui barrels:check

      - name: Check UI Icons
        run: |
          pnpm --filter @repo/ui icons:sync:check
          pnpm --filter @repo/ui icons:barrels:check

      - name: Build Storybook
        run: pnpm --filter @apps/storybook build

      - name: Validate Registry
        run: |
          pnpm --filter @apps/registry registry:build
          git diff --exit-code
